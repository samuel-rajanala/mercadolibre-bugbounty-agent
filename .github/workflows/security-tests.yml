name: Offline security regression tests

on:
  push:
    branches: [main, "phase-2.9-security-remediation"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile modified Python modules
        run: |
          python -m py_compile scripts/authorization_gate.py scripts/safe_http.py scripts/api-security-assessment.py scripts/auth-audit-assessment.py scripts/authz-audit-assessment.py scripts/payment-security-assessment.py scripts/passive-reconnaissance.py
      - name: Run offline security regression tests
        run: python -m pytest -q tests/test_phase_2_9_security_remediation.py tests/test_safe_http.py
